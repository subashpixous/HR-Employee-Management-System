# Internal nginx for the frontend container: serves the built SPA only.
# TLS and API/WS proxying are handled by the separate reverse-proxy nginx.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed, immutable build assets: cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Never cache the app shell so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
