# ============================================================
# Reverse proxy for the HR Portal (edge nginx container)
#   /        -> frontend  (static SPA, port 80)
#   /api     -> backend   (Spring Boot, port 7060)
#   /ws      -> backend   (STOMP/SockJS WebSocket, port 7060)
#
# SSL-ready: works over HTTP out of the box AND serves the ACME challenge.
# After running init-letsencrypt.sh, enable the :443 block at the bottom.
# ============================================================

# Docker's embedded DNS: re-resolve service names so container restarts don't
# leave nginx pointing at a stale IP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------- HTTP :80 ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 25m;

    # Container / load-balancer health probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt HTTP-01 challenge (needed to issue/renew certificates).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- After you have TLS certs, force HTTPS by uncommenting the next line
    # ---- and commenting out the three proxy locations below. ----
    # return 301 https://$host$request_uri;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Analytics service (FastAPI). Longest-prefix match beats /api below.
    location /api/analytics {
        set $upstream_analytics http://analytics:8082;
        proxy_pass $upstream_analytics;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # REST API
    location /api {
        set $upstream_backend http://backend:7060;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket (notifications, chat, call signaling)
    location /ws {
        set $upstream_ws http://backend:7060;
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Static SPA
    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

