name: Deploy HR Portal

# Build backend + frontend images, push to Docker Hub, then SSH into the
# EC2 host and roll the stack. Mirrors the OnePortal deployment architecture.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hr-portal-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hr-portal-frontend

jobs:
  # ============================================================
  # 1) Build & push images
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2) Deploy to EC2
  # ============================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose + nginx + deploy script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/nginx/default.conf,deploy/deploy.sh,deploy/init-letsencrypt.sh,deploy/.env.example"
          target: "/home/${{ secrets.EC2_USER }}/hr-portal"
          strip_components: 1

      - name: Pull images and restart stack on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            cd ~/hr-portal
            if [ ! -f .env ]; then
              echo "FATAL: ~/hr-portal/.env is missing. Create it from .env.example before deploying."
              exit 1
            fi
            # DOCKERHUB_USERNAME/IMAGE_TAG also live in .env; export here as a fallback.
            export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            export IMAGE_TAG='latest'
            chmod +x deploy.sh init-letsencrypt.sh
            ./deploy.sh
