name: Deploy HR Portal

# Build backend + frontend + analytics images, push to Docker Hub, then SSH
# into the EC2 host and roll the stack. Mirrors the OnePortal deployment
# architecture.
#
# GitHub Secrets used by this workflow (must exist with these exact names):
#   DOCKER_HUB_USERNAME  - Docker Hub account that owns the images
#   DOCKER_HUB_TOKEN     - Docker Hub access token
#   EC2_HOST             - public IP / DNS of the EC2 instance
#   EC2_SSH_KEY          - private SSH key for the "ubuntu" user
# (SONAR_TOKEN / SONAR_HOST_URL exist in the repo but are not used here.)
#
# EC2 conventions (hardcoded, no extra secrets needed):
#   SSH user:          ubuntu
#   SSH port:          22
#   Project directory: /home/ubuntu/app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/hr-portal-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/hr-portal-frontend
  ANALYTICS_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/hr-portal-analytics

jobs:
  # ============================================================
  # 1) Build & push images
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push analytics image
        uses: docker/build-push-action@v6
        with:
          context: ./analytics-service
          file: ./analytics-service/Dockerfile
          push: true
          tags: |
            ${{ env.ANALYTICS_IMAGE }}:latest
            ${{ env.ANALYTICS_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,mode=max,scope=analytics

  # ============================================================
  # 2) Deploy to EC2
  # ============================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose + nginx + deploy script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "deploy/docker-compose.yml,deploy/nginx/default.conf,deploy/deploy.sh,deploy/init-letsencrypt.sh,deploy/.env.example"
          target: "/home/ubuntu/app"
          strip_components: 1

      - name: Pull images and restart stack on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/app
            if [ ! -f .env ]; then
              echo "FATAL: /home/ubuntu/app/.env is missing. Create it from .env.example before deploying."
              exit 1
            fi
            # DOCKER_HUB_USERNAME/IMAGE_TAG also live in .env; export here as a fallback.
            export DOCKER_HUB_USERNAME='${{ secrets.DOCKER_HUB_USERNAME }}'
            export IMAGE_TAG='latest'
            chmod +x deploy.sh init-letsencrypt.sh
            ./deploy.sh
